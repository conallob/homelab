machine:
  install:
    # All CM4 and CM5 nodes have onboard eMMC storage.
    # Control-plane nodes have a 120GB 2242 NVMe, used as their install disk and for etcd.
    # Worker nodes have a 1TB 2280 NVMe, used by the CSI.
    disk: /dev/nvme0n1
  nodeLabels:
    node-role.kubernetes.io/control-plane: ""
    kubernetes.io/arch: arm64
    node.kubernetes.io/soc: cm4
    node.kubernetes.io/ram: 8gb
    node.kubernetes.io/baseboard: computeblade-dev
    node.kubernetes.io/baseboard-manufacturer: uptime-labs
  network:
    nameservers:
      - 192.168.1.3
      - 192.168.6.1
      - 8.8.8.8
      - 1.1.1.1
    interfaces:
      - interface: end0
        dhcp: true
  time:
    servers:
      - 162.159.200.1
      - 162.159.200.123

cluster:
  allowSchedulingOnControlPlanes: true
  # Per https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
  network:
    cni:
      name: none
  proxy:
    disabled: true
