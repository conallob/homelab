# Lets tuppr (apps/tuppr in homelab-apps), running in the "tuppr" namespace,
# call the Talos API with os:admin so it can upgrade nodes. Apply to the
# CONTROL-PLANE node(s) only, before the tuppr app syncs; Talos rejects it on
# workers ("can only be enabled on control plane machines"):
#   talosctl -n <control-plane-ip> patch mc --patch @cfg/talos/patch-tuppr-api-access.yaml
# allowedKubernetesNamespaces must match the namespace tuppr runs in.
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - tuppr
