ipam:
    mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost # KubePrism
k8sServicePort: 7445
securityContext:
    capabilities:
        # Talos drops SYS_MODULE from the bounding set — this is the current crashloop
        ciliumAgent:
            [
                CHOWN,
                KILL,
                NET_ADMIN,
                NET_RAW,
                IPC_LOCK,
                SYS_ADMIN,
                SYS_RESOURCE,
                DAC_OVERRIDE,
                FOWNER,
                SETGID,
                SETUID,
            ]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
    autoMount:
        enabled: false
    hostRoot: /sys/fs/cgroup
# Answer ARP for LoadBalancer IPs from 192.168.7.0/24 (see cilium-lb.yaml)
l2announcements:
    enabled: true
devices: end0
gatewayAPI:
    enabled: true
    enableAlpn: true # needed for GRPCRoute over TLS
    enableAppProtocol: true
