# Let the Kubernetes API server accept Google sign-ins, for Headlamp
# (apps/headlamp in homelab-apps). Control-plane nodes only.
#
# Talos owns kube-apiserver's --authentication-config, so this is the
# KubeAuthenticationConfig document, not extraArgs/machine.files (those are
# rejected: "kube-apiserver config is already set in v1alpha1 config").
# `configuration` is a literal Kubernetes AuthenticationConfiguration and
# REPLACES Talos's default, so the default `anonymous` block is repeated here:
# without it /livez, /readyz and /healthz would need credentials and the
# apiserver's health probes would fail.
#
# Google ID tokens carry no groups claim, so a CEL expression derives a group
# from the email domain instead:
#   user:  google:<email>          (verified emails only)
#   group: google:taku.ie          (any verified @taku.ie address)
# Only two kinds of account are let in at all; every other Google account is
# rejected here (401) rather than merely having no RBAC rights:
#   - conall@gmail.com and conall@taku.ie (admins, bound in RBAC)
#   - any other @taku.ie address (read only, bound in RBAC)
# RBAC for these names lives in homelab-apps/apps/headlamp/templates/rbac.yaml;
# keep the two admin addresses below in step with it.
#
# The audience is the OAuth client ID Headlamp uses (the client-id field of the
# 1Password item headlamp/google-oauth). A client ID is public, not a secret.
#
# Apply to ONE control-plane node first and confirm `kubectl get nodes` still
# works before doing the rest. Client-certificate kubeconfigs and talosctl are
# unaffected by this config.
#
#   talosctl patch mc --nodes <control-plane-ip> \
#     --patch @cfg/talos/patch-apiserver-oidc.yaml
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt:
    - issuer:
        url: https://accounts.google.com
        audiences:
          - 681312183269-bq4jvup0v9vog0k79mqceke8edr1nbfk.apps.googleusercontent.com
      claimValidationRules:
        - expression: "claims.email_verified == true"
          message: only verified Google email addresses are accepted
      claimMappings:
        username:
          expression: "'google:' + claims.email"
        groups:
          expression: "claims.email.endsWith('@taku.ie') ? ['google:taku.ie'] : []"
      userValidationRules:
        - expression: "user.username in ['google:conall@gmail.com', 'google:conall@taku.ie'] || 'google:taku.ie' in user.groups"
          message: only conall@gmail.com, conall@taku.ie and @taku.ie accounts may sign in
