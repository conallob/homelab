# Let the Kubernetes API server accept Google sign-ins, for Headlamp
# (apps/headlamp in homelab-apps). Control-plane nodes only.
#
# Uses the structured AuthenticationConfiguration (rather than --oidc-* flags)
# because Google ID tokens carry no groups claim: the CEL expression below
# derives a group from the email domain instead.
#   user:  google:<email>          (verified emails only)
#   group: google:taku.ie          (any verified @taku.ie address)
# Only two kinds of account are let in at all; every other Google account is
# rejected here (401) rather than merely having no RBAC rights:
#   - conall@gmail.com and conall@taku.ie (admins, bound in RBAC)
#   - any other @taku.ie address (read only, bound in RBAC)
# RBAC for these names lives in homelab-apps/apps/headlamp/templates/rbac.yaml;
# keep the two admin addresses below in step with it.
#
# Before applying, replace REPLACE_WITH_GOOGLE_CLIENT_ID with the OAuth client
# ID Headlamp uses (the same value as the client-id field of the 1Password item
# headlamp/google-oauth). Apply to ONE control-plane node first and confirm
# `kubectl get nodes` still works before doing the rest; a bad file stops that
# node's kube-apiserver starting. Client-certificate kubeconfigs and
# talosctl are unaffected.
#
#   talosctl patch mc --nodes <control-plane-ip> \
#     --patch @cfg/talos/patch-apiserver-oidc.yaml
machine:
  files:
    - path: /var/etc/kubernetes/auth/authentication-config.yaml
      permissions: 0o444
      op: create
      content: |
        apiVersion: apiserver.config.k8s.io/v1beta1
        kind: AuthenticationConfiguration
        jwt:
          - issuer:
              url: https://accounts.google.com
              audiences:
                - REPLACE_WITH_GOOGLE_CLIENT_ID
            claimValidationRules:
              - expression: "claims.email_verified == true"
                message: only verified Google email addresses are accepted
            claimMappings:
              username:
                expression: "'google:' + claims.email"
              groups:
                expression: "claims.email.endsWith('@taku.ie') ? ['google:taku.ie'] : []"
            userValidationRules:
              - expression: "user.username in ['google:conall@gmail.com', 'google:conall@taku.ie'] || 'google:taku.ie' in user.groups"
                message: only conall@gmail.com, conall@taku.ie and @taku.ie accounts may sign in
cluster:
  apiServer:
    extraArgs:
      authentication-config: /etc/kubernetes/auth/authentication-config.yaml
    extraVolumes:
      - hostPath: /var/etc/kubernetes/auth
        mountPath: /etc/kubernetes/auth
        readonly: true
