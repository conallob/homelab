# Upstream chart (ghcr.io/tinkerbell/charts/tinkerbell, v0.25.0+) replaced
# the old per-component "stack" chart this file used to target (separate
# tink/rufio/hegel/smee top-level sections) with a single unified Deployment.
# See https://github.com/tinkerbell/tinkerbell/blob/main/docs/technical/HELM_VALUES_MIGRATION.md
#
# trustedProxies is deliberately NOT set here — it's the cluster's live pod
# CIDR, which upstream's own README derives at install time rather than
# hardcoding:
#   --set "trustedProxies={$(kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}' | tr ' ' ',')}"

# Cilium-announced LoadBalancer VIP for Tinkerbell's own HTTP/API services
# (not DHCP/TFTP — see deployment.init below for that). Picked from the
# 192.168.7.0/24 pool; lab-gateway already holds .1.
publicIP: 192.168.7.67

service:
  # Defaults to kube-vip's loadBalancerClass, which isn't installed in this
  # cluster — clear it so Cilium's LB-IPAM (cfg/talos/cilium-lb.yaml) claims
  # the Service instead, same as every other LoadBalancer Service here.
  lbClass: ""

optional:
  hookos:
    # All nodes chainload straight to Talos via each Hardware object's own
    # netboot.ipxe.url (factory.talos.dev) — Tinkerbell's own Workflow+HookOS
    # OS-install pipeline is never used, so this needs no artifactsFileServer.
    enabled: false

deployment:
  # Must be the node physically on the same L2/VLAN as the CM4 lab nodes:
  # smee's DHCP proxy listens on a macvlan sub-interface (deployment.init,
  # enabled by default) off this node's default-route interface, since raw
  # broadcast DHCP traffic can't reach a pod through a Cilium L2-announced
  # Service the way unicast traffic to a VIP can.
  nodeSelector:
    kubernetes.io/hostname: lab-node-1
  envs:
    smee:
      # The Unifi router owns real DHCP leases for 192.168.6.0/23 (see
      # cfg/tinkerbell/hardware.yaml) — Tinkerbell only supplies PXE boot
      # options (next-server/bootfile) as a second responder, never assigns
      # an address itself. Matches Hardware objects to requests by the IP
      # the Unifi router already leased, not by issuing its own.
      dhcpMode: "proxy"
