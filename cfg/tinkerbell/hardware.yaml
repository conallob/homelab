# One Hardware object per CM4 lab node. IP addresses are the Unifi router's
# static DHCP reservations (192.168.6.10<N> for lab-node-<N>) — Tinkerbell
# runs in `proxy` DHCP mode (see values.yaml), so it never assigns these
# itself and relies entirely on matching the real lease by IP. If a
# reservation ever changes in Unifi, update it here too or PXE info silently
# stops matching (no error, the node just never gets a netboot offer).
#
# netboot.ipxe.url pins the schematic/version validated as fixed for these
# exact ComputeBlade CM4 boards (console=ttyAMA0,115200 GRUB->kernel hang
# fix, see docs/CHANGELOG.md 2026-09-19) — bump deliberately, not by copying
# an older reference.
---
apiVersion: "tinkerbell.org/v1alpha1"
kind: Hardware
metadata:
  name: lab-node-1
  namespace: tinkerbell
spec:
  interfaces:
    - dhcp:
        ip:
          address: 192.168.6.101
          gateway: 192.168.6.1
          netmask: 255.255.254.0
        mac: d8:3a:dd:9f:54:db
        name_servers:
          - 192.168.1.3
        uefi: true
      netboot:
        allowPXE: true
        allowWorkflow: false
        ipxe:
          url: https://pxe.factory.talos.dev/pxe/6b700850e84fbbaa67e3558d1d8599f336f36eb063b3a3763c97f7bc7b07a760/v1.14.0/metal-arm64
